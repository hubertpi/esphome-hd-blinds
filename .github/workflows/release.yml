name: Numbered HACS release
on:
  push:
    branches: [main]
    paths: [custom_components/hd_blinds/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numbered-hacs-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/hd_blinds/manifest.json', 'utf8'));
            const version = manifest.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected numeric major.minor.patch version');
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag: version});
              core.info(`Release ${version} already exists`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...repo, tag_name: version, name: version,
                target_commitish: context.sha,
                generate_release_notes: true,
                draft: false, prerelease: false
              });
            }
